# Keeps the "live trading on Bitget" block of the Tradester section up to date.
# The private trading repo publishes ./trades.sqlite here twice a day (only percentages,
# no account amounts) with its own token; this repo holds no credential to it.
# Whenever that file changes, this job rewrites the block in site/index.html and commits
# only if the numbers changed, so Render redeploys only then.
name: Live results

on:
  push:
    branches: [main]
    paths: [trades.sqlite]
  workflow_dispatch:

permissions:
  contents: write

concurrency: live-results

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the block and commit if it changed
        run: |
          set -euo pipefail
          result=$(python3 live/update_live.py trades.sqlite)
          echo "Live block: $result"
          [ "$result" = "changed" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Update live Bitget results"
          git pull --rebase
          git push
